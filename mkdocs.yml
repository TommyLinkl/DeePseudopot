site_name: DeepPseudopot Documentation
site_description: Reference manual and usage guides for DeepPseudopot.
nav:
  - Introduction: index.md
  - Installation & Quick Start: install.md
  - Workflow Modes: workflows.md
  - Input Data Description:
    - Summary: inputs.md
    - Environment & Input Bundle: setup.md
    - Configuration Reference: configuration.md
    - System & Data Files: system-data.md
  - Output Data Description:
    - Summary: outputs.md
    - Monitoring & Utilities: outputs-monitoring.md
  - Troubleshooting Guide: troubleshooting.md
theme:
  name: material
plugins:
  - search
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
    - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
extra_css:
  - css/custom.css